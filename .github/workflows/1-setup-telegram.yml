name: 1 - Setup Telegram notifications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Check Alia notification setup
    runs-on: ubuntu-latest
    env:
      STUDENT_ID: alia
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED }}
      NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Alia site and GitHub settings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          global.window = {};
          require('./config.js');

          const cfg = window.APP_CONFIG || {};
          const studentId = String(cfg.student?.id || '');
          const url = String(cfg.supabase?.url || '');
          const ref = (url.match(/^https:\/\/([a-z0-9-]+)\.supabase\.co\/?$/) || [])[1];
          const required = (name) => {
            const value = String(process.env[name] || '').trim();
            if (!value) throw new Error('Missing GitHub Actions variable/secret: ' + name);
            return value;
          };

          if (studentId !== 'alia') throw new Error('config.js: expected student id alia');
          if (ref !== 'zqzgarvmpqqqaobeicpc') throw new Error('config.js: unexpected Supabase project');
          if (required('STUDENT_ID') !== studentId) throw new Error('STUDENT_ID must be alia');
          if (required('SUPABASE_PROJECT_ID') !== ref) throw new Error('SUPABASE_PROJECT_ID does not match config.js');
          if (required('TELEGRAM_NOTIFICATIONS_ENABLED') !== 'true') throw new Error('Enable TELEGRAM_NOTIFICATIONS_ENABLED=true');
          if (!/^https:\/\/[^\s/]+/.test(required('SITE_BASE_URL'))) throw new Error('SITE_BASE_URL must be an HTTPS site URL');
          required('NOTIFY_WEBHOOK_SECRET');

          console.log('Alia settings OK: studentId=' + studentId + ', Supabase project=' + ref);
          console.log('The Telegram recipient is configured centrally in Supabase; this workflow does not redeploy the shared function.');
          NODE

      - name: Check shared notification endpoint (does not send a message)
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/notify-telegram"
          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' -X OPTIONS "$endpoint")"
          if [ "$status" != "200" ] && [ "$status" != "204" ]; then
            echo "Notification function preflight failed with HTTP $status" >&2
            exit 1
          fi
          echo "Notification function is reachable (HTTP $status). No Telegram message was sent."

      - name: Done
        run: echo "Alia Telegram prerequisites verified. Use workflow 2 manually when ready to notify about new materials."
